<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Dehazing Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: #2c3e50;
    }
    .upload-box {
      background: #ffffff;
      border-radius: 10px;
      padding: 2rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: inline-block;
      margin-top: 2rem;
    }
    input[type="file"] {
      margin: 1rem 0;
    }
    button {
      padding: 0.7rem 1.5rem;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
    #output {
      margin-top: 2rem;
    }
    img {
      max-width: 100%;
      height: auto;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <h1>🌀 Image Dehazing Tool</h1>
  <p>Upload your hazy image, and we will clear it for you!</p>

  <div class="upload-box">
    <form id="dehaze-form" enctype="multipart/form-data" method="POST" action="/dehaze">
      <input type="file" name="image" accept="image/*" required>
      <br>
      <button type="submit">Upload and Dehaze</button>
    </form>
  </div>

  <div id="output">
    <!-- Dehazed image will be shown here after backend processing -->
  </div>

</body>
</html>
